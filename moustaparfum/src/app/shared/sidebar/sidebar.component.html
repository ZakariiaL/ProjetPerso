<div class="sidebar-backdrop" [class.visible]="!isClosed" (click)="closeSidebar()"></div>

<aside class="sidebar-layout" [class.collapsed]="isClosed">
  <div class="sidebar-header">
    <div>
      <span>Menu</span>
      <strong>Moustaparfum</strong>
    </div>

    <button class="close-button" type="button" (click)="closeSidebar()" aria-label="Fermer le menu">
      <span class="material-icons">close</span>
    </button>
  </div>

  <nav class="content">
    <button class="sidebar-icon" *ngFor="let menu of menus" type="button" (click)="navigate(menu.route)">
      <i [class]="menu.icon"></i>
      <span>{{ menu.label }}</span>
    </button>
  </nav>
</aside>
