<div  class="sidebar-layout" [class.collapsed]="isClosed">


  <button class="toggle-button" (click)="onClick($event)">
      <i class="fa-solid fa-angles-right" [class.fa-chevron-left]="!isClosed" [class.fa-chevron-right]="isClosed"></i>
  </button>

  <div class="content">
      <div class="sidebar-icon" *ngFor="let menu of menus" (click)="menu.action($event)">
          <i [class]="menu.icon"></i>
          <span *ngIf="!isClosed">{{ menu.label }}</span>
      </div>
  </div>

</div>
