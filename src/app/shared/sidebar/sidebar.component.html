<div class="sidebar-backdrop" [class.visible]="!isClosed" (click)="closeSidebar()"></div>

<aside class="sidebar-layout" [class.collapsed]="isClosed">
  <nav class="content">
    <button
      class="sidebar-icon"
      *ngFor="let menu of menus"
      type="button"
      [class.active]="isActive(menu.route)"
      (click)="navigate(menu.route)"
    >
      <span class="material-icons">{{ menu.icon }}</span>
      <span>{{ menu.label }}</span>
    </button>
  </nav>
</aside>
