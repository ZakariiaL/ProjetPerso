<div class="sidebar-backdrop" [class.visible]="!isClosed" (click)="closeSidebar()"></div>

<aside class="sidebar-layout" [class.collapsed]="isClosed">
  <nav class="content">
    <button class="sidebar-icon" *ngFor="let menu of menus" type="button" (click)="navigate(menu.route)">
      <i [class]="menu.icon"></i>
      <span>{{ menu.label }}</span>
    </button>
  </nav>
</aside>
