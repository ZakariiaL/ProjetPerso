<header class="navbar" [class.hidden]="isHidden" [class.scrolled]="isScrolled" [class.sidebar-open]="sidebarOpen">
  <div class="left">
    <button class="menu-btn" (click)="toggleSidebar()" aria-label="Ouvrir le menu">
      <span class="material-icons">{{ sidebarOpen ? 'close' : 'menu' }}</span>
    </button>
    <a routerLink="/" class="logo">
      <img src="assets/logo.png" alt="Moustaparfum" />
    </a>
  </div>

  <nav class="nav-links">
    <a routerLink="/">Accueil</a>
    <a routerLink="/category/homme">Hommes</a>
    <a routerLink="/category/femme">Femmes</a>
    <a routerLink="/category/niche">Niche</a>
    <a routerLink="/category/ambiances">Ambiances</a>
    <a routerLink="/collection">Nouveautés</a>
    <a routerLink="/contact">Contact</a>
    <a *ngIf="adminSession" routerLink="/admin">Admin</a>
  </nav>

  <div class="center">
    <div class="search-wrapper" [class.active]="searchVisible || isDesktop">
      <button class="search-icon" (click)="toggleSearch()" *ngIf="!isDesktop" aria-label="Rechercher">
        <span class="material-icons">search</span>
      </button>

      <input
        class="search-input"
        type="text"
        placeholder="Rechercher..."
        [class.show]="searchVisible || isDesktop"
      />
    </div>
  </div>

  <div class="right-actions">
    <a routerLink="/cart" class="cart-icon" [class.bump]="cartBump" aria-label="Panier">
      <span class="material-icons">shopping_cart</span>
      <span class="badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
    </a>

    <a
      *ngIf="!adminSession"
      routerLink="/login"
      class="admin-action"
      aria-label="Espace administrateur"
      title="Espace administrateur"
    >
      <span class="material-icons">account_circle</span>
    </a>

    <a
      *ngIf="adminSession"
      routerLink="/admin"
      class="admin-action admin-dashboard-link"
      aria-label="Retour au tableau de bord admin"
      title="Retour au tableau de bord admin"
    >
      <span class="material-icons">space_dashboard</span>
    </a>

    <button
      *ngIf="adminSession"
      type="button"
      class="admin-action"
      (click)="logout()"
      aria-label="Se déconnecter de l'espace administrateur"
      title="Se déconnecter de l'espace administrateur"
    >
      <span class="material-icons">power_settings_new</span>
    </button>
  </div>
</header>

<div class="search-overlay" *ngIf="searchVisible && !isDesktop" (click)="toggleSearch()"></div>

<div class="blackfriday-banner">
  <div class="blackfriday-track">
    <span class="blackfriday-text">
      Soldes ! Jusqu'à -50% sur une sélection de parfums
    </span>
  </div>
</div>
